<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="exhaust — the Fe compiler explores every reachable state of an escrow inside fe build: 736 lamps lit at capacity 21, all held. One line changes. A new red lamp: Deposit, Deposit, Lock, Release, Refund.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur). No text. Generated by gen/build-svgs.cjs.
  0-12%    steady state: the full mark (= icon.svg): a lens of lit lamps, the red route, one red lamp outside the lens. Poster = static icon.
  12-44%   trigger: the red route lets go, every lamp goes dark, then the breadth-first search relights the lens column
           by column (amber frontier → warm white).                                                  data-story="beat-2"
  44-70%   mechanism: 736 lamps lit at capacity 21, all held. One line changes. A new red lamp: Deposit, Deposit, Lock, Release, Refund.
           (a green ring closes round the lens = exhausted; then the route draws red along the lower edge and the new red
           lamp pops outside the lens with a ripple.)                                                 data-story="beat-3"
  70-92%   resolution: the red route and the new lamp stay; the red halo breathes.                    data-story="beat-4"
  92-100%  seam: the end state IS the poster state, so the restart is continuous (no cut).
-->
