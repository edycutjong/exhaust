<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="exhaust — a lens of lit lamps (every reachable state explored) and one red lamp outside it: the state a bug reaches">
  <!-- exhaust mark: the mimic panel in miniature. A lens of lit lamps = the explored state set (columns = BFS depth,
       1·2·3·2·1, the shape of the real escrow lattice); the red route leaves it along the lower edge to ONE red lamp
       outside the lens = the violating state the correct contract never reaches. Self-plated: reads on white and #0d1117. -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--primary, #F2E8CC)" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="var(--primary, #F2E8CC)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--after-lamp, #FF6150)" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="var(--after-lamp, #FF6150)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="enamel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#323A35"/>
      <stop offset="100%" stop-color="var(--panel, #2B322E)"/>
    </linearGradient>
  </defs>

  <!-- plate: enamel board, ring for dark pages, engraved inner rim -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="url(#enamel)" stroke="var(--unlit-ring, #7A847E)" stroke-width="8"/>
  <rect x="40" y="40" width="432" height="432" rx="84" fill="none" stroke="var(--primary, #F2E8CC)" stroke-opacity="0.10" stroke-width="3"/>

  <!-- wires (transitions) -->
  <g stroke="var(--primary, #F2E8CC)" stroke-opacity="0.30" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M104 226L180 188M104 226L180 264M180 188L256 150M180 188L256 226M180 264L256 226M256 150L332 188M256 226L332 188M256 226L332 264M256 302L332 264M332 188L408 226M332 264L408 226"/>
  </g>
  <!-- the red route: initial lamp → along the lower edge → out of the lens -->
  <path d="M104 226L180 264L256 302L344 404" fill="none" stroke="var(--after-lamp, #FF6150)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- halos -->
  <g fill="url(#halo)">
    <circle cx="104" cy="226" r="58"/><circle cx="180" cy="188" r="58"/><circle cx="256" cy="150" r="58"/>
    <circle cx="256" cy="226" r="58"/><circle cx="332" cy="188" r="58"/><circle cx="332" cy="264" r="58"/><circle cx="408" cy="226" r="58"/>
  </g>
  <circle cx="344" cy="404" r="92" fill="url(#redHalo)"/>

  <!-- lamps: explored (warm), route (red), the new red lamp outside the lens -->
  <g fill="var(--primary, #F2E8CC)">
    <circle cx="104" cy="226" r="30"/><circle cx="180" cy="188" r="30"/><circle cx="256" cy="150" r="30"/>
    <circle cx="256" cy="226" r="30"/><circle cx="332" cy="188" r="30"/><circle cx="332" cy="264" r="30"/><circle cx="408" cy="226" r="30"/>
  </g>
  <g fill="var(--after-lamp, #FF6150)">
    <circle cx="180" cy="264" r="30"/><circle cx="256" cy="302" r="30"/>
  </g>
  <circle cx="344" cy="404" r="42" fill="var(--after-lamp, #FF6150)" stroke="#FFD2CB" stroke-width="6"/>
</svg>
