<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="ui-monospace, Menlo, Consolas, monospace">
  <title id="t">exhaust architecture: one step() function, three executions</title>
  <desc id="d">src/escrow.fe holds step() and the invariants. The compile-time explorer runs it under static_assert inside fe build; the escrow contract's recv handlers call the same step() at runtime on two backends; the tests replay every reachable transition via the deployed contract. A Python oracle outside Fe checks the pinned counts. Bug patches to step() turn fe build red.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23221E"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A8261C"/></marker>
  </defs>
  <rect width="960" height="470" fill="#EEEADF"/>
  <g fill="none" stroke="#23221E" stroke-width="1.5">
    <rect x="300" y="30" width="360" height="92" fill="#F2E8CC"/>
    <rect x="30" y="230" width="250" height="100" fill="#FFFFFF"/>
    <rect x="355" y="230" width="250" height="100" fill="#FFFFFF"/>
    <rect x="680" y="230" width="250" height="100" fill="#FFFFFF"/>
    <rect x="30" y="390" width="250" height="56" fill="#FFFFFF" stroke-dasharray="5 4"/>
    <rect x="355" y="390" width="250" height="56" fill="#FFFFFF"/>
    <rect x="680" y="390" width="250" height="56" fill="#FFFFFF"/>
    <rect x="700" y="42" width="230" height="68" fill="#FFFFFF" stroke="#A8261C" stroke-dasharray="5 4"/>
    <path d="M480 122V176H155V228" marker-end="url(#a)"/>
    <path d="M480 122V228" marker-end="url(#a)"/>
    <path d="M480 122V176H805V228" marker-end="url(#a)"/>
    <path d="M155 330V388" marker-end="url(#a)"/>
    <path d="M480 330V388" marker-end="url(#a)"/>
    <path d="M805 330V388" marker-end="url(#a)"/>
    <path d="M700 76H662" stroke="#A8261C" marker-end="url(#r)"/>
  </g>
  <g fill="#23221E" font-size="14">
    <text x="480" y="58" text-anchor="middle" font-weight="700">src/escrow.fe</text>
    <text x="480" y="80" text-anchor="middle">const fn step(state, action, cap)</text>
    <text x="480" y="100" text-anchor="middle">5 named invariants</text>
    <text x="155" y="256" text-anchor="middle" font-weight="700">escrow_explore.fe</text>
    <text x="155" y="278" text-anchor="middle">BFS as a const fn</text>
    <text x="155" y="298" text-anchor="middle">static_assert pins</text>
    <text x="155" y="318" text-anchor="middle">runs inside fe build</text>
    <text x="480" y="256" text-anchor="middle" font-weight="700">escrow_contract.fe</text>
    <text x="480" y="278" text-anchor="middle">recv: load, step(), store</text>
    <text x="480" y="298" text-anchor="middle">fe test (Sonatina EVM)</text>
    <text x="480" y="318" text-anchor="middle">fe test --backend native</text>
    <text x="805" y="256" text-anchor="middle" font-weight="700">tests.fe</text>
    <text x="805" y="278" text-anchor="middle">runtime search agrees</text>
    <text x="805" y="298" text-anchor="middle">replays every reachable edge</text>
    <text x="805" y="318" text-anchor="middle">via the deployed contract</text>
    <text x="155" y="414" text-anchor="middle" font-weight="700">fe build: green or red</text>
    <text x="155" y="434" text-anchor="middle" font-size="12">invariant name + left: digits</text>
    <text x="480" y="414" text-anchor="middle" font-weight="700">same counts, both backends</text>
    <text x="480" y="434" text-anchor="middle" font-size="12">494 / 736 asserted in tests</text>
    <text x="805" y="414" text-anchor="middle" font-weight="700">25,646 calls checked</text>
    <text x="805" y="434" text-anchor="middle" font-size="12">ok + state match step()</text>
    <text x="815" y="66" text-anchor="middle" fill="#A8261C" font-weight="700">demo/*.patch</text>
    <text x="815" y="86" text-anchor="middle" fill="#A8261C" font-size="12">one-line bug in step()</text>
    <text x="815" y="102" text-anchor="middle" fill="#A8261C" font-size="12">fe build must go red</text>
    <text x="30" y="24" font-size="12" fill="#64605A">escrow shown; src/vault*.fe repeat the same shape</text>
    <text x="30" y="462" font-size="12" fill="#64605A">tools/ref_model.py (Python oracle, outside Fe) checks every pinned count</text>
  </g>
</svg>
