name: release

# Semantic versioning from Angular-style commit prefixes (fix:/perf: patch, feat: minor, feat!: or BREAKING CHANGE: major;
# docs/chore/test/refactor/style/ci: no release). The first release, v0.1.0, was tagged by hand at the end of the harden
# phase; every later release is read from that tag on. It runs only after the CI workflow succeeded on main, so a red
# commit is never tagged (a CI run cancelled by a newer push is covered by the next run: the version comes from the tag range).
# A manual run (workflow_dispatch) is refused unless CI already succeeded on that commit.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag and create the release (this job only)
      actions: read # a manual run checks that CI succeeded on the commit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # full history and tags: the next version is computed from commits since the last tag

      - name: A manual run needs a successful CI run on this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$SHA" --status success --json databaseId --jq 'length')
          if [ "$ok" -eq 0 ]; then echo "No successful CI run on $SHA: refusing to release."; exit 1; fi

      - name: Compute next version from Angular commits
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          LAST=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST" ]; then
            LOG=$(git log --format=%B); CUR="0.0.0"
          else
            LOG=$(git log --format=%B "${LAST}..HEAD"); CUR="${LAST#v}"
          fi
          if [ -z "$(printf '%s' "$LOG" | tr -d '[:space:]')" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BUMP="none"
          if printf '%s\n' "$LOG" | grep -qE '^(feat|fix|perf)(\(.+\))?!:|^BREAKING CHANGE:'; then BUMP="major"
          elif printf '%s\n' "$LOG" | grep -qE '^feat(\(.+\))?:'; then BUMP="minor"
          elif printf '%s\n' "$LOG" | grep -qE '^(fix|perf)(\(.+\))?:'; then BUMP="patch"
          fi
          if [ "$BUMP" = none ]; then
            echo "No releasable commits since ${LAST:-the beginning}."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          IFS=. read -r MA MI PA <<< "$CUR"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          NEXT="v${MA}.${MI}.${PA}"
          echo "Bump: $BUMP  ${LAST:-none} -> $NEXT"
          if git rev-parse -q --verify "refs/tags/$NEXT" > /dev/null; then
            echo "$NEXT already exists: nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Tag and publish the release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "$NEXT"
          git push origin "$NEXT"
          gh release create "$NEXT" --generate-notes --title "$NEXT"
